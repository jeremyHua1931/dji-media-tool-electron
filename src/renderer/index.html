<!DOCTYPE html>
<!-- index.html —— 渲染进程入口（electron-vite + Vue3）
     只放挂载点与入口脚本；Vue 应用由 src/main.js 启动，界面全部由组件渲染。
     CSP：只放行自身 + data:（占位 SVG）+ blob:（缩略图 Blob URL）；
     connect-src 放行 localhost 的 ws/http（开发模式 vite HMR 需要，生产无外部源）。
     #app 挂载点是 src/main.js 里 createApp(...).mount('#app') 的目标 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*;" />
  <title>DJI Pocket 素材筛选复制工具</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
